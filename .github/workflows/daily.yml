name: Generate Daily Cards

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Install fonts
        run: |
          sudo apt-get install -y fonts-dejavu fonts-noto
          fc-cache -fv

      - name: Generate cards
        run: python generator/generate.py

      - name: Push output to daily branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Orphan branch (never grows in history)
          git fetch origin daily 2>/dev/null || true
          git checkout --orphan daily-new
          git rm -rf --cached . > /dev/null 2>&1 || true

          git add -f output/

          git commit -m "chore: daily cards $(date -u +%Y-%m-%d)"

          git push origin daily-new:daily --force
